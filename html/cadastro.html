<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Cadastro — CS2 Bracket | Plataforma de E-Sports</title>
  <meta name="description" content="Crie sua conta na maior plataforma de campeonatos de CS2. Participe de torneios, monte seus brackets e dispute com os melhores jogadores." />
  <meta name="theme-color" content="#723EC3" />

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/cadastro.css" />
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>


  <!-- ======================================================
       CAROUSEL DE FUNDO (CSS-only, sem JavaScript)
       4 slides com fade de 5 segundos cada = 20s de ciclo
  ======================================================= -->
  <div class="carousel-bg" role="presentation" aria-hidden="true">
    <div class="carousel-slide"></div>
    <div class="carousel-slide"></div>
    <div class="carousel-slide"></div>
    <div class="carousel-slide"></div>
  </div>

  <!-- ======================================================
       CONTEÚDO PRINCIPAL
  ======================================================= -->
  <main class="page-wrapper">
    <article class="auth-card" role="main" aria-labelledby="cadastro-titulo">

      <!-- Logo / Identidade -->
      <header class="card-header">
        <div class="card-logo">
          <div class="card-logo-icon" aria-hidden="true">
            <!-- Ícone de troféu / bracket -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 5h-2V3H7v2H5C3.9 5 3 5.9 3 7v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V18H9v2h6v-2h-2v-2.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zm-2 3c0 1.65-1.35 3-3 3s-3-1.35-3-3V5h6v3zM5 8V7h2v3.87A3.005 3.005 0 0 1 5 8zm14 0c0 1.47-1.05 2.7-2.45 2.97L16 10.87V7h2l.01 1z"/>
            </svg>
          </div>
          <span class="card-logo-text">CS2<span>Bracket</span></span>
        </div>
        <h1 class="card-title" id="cadastro-titulo">Criar conta</h1>
        <p class="card-subtitle">Junte-se à arena. Domine o bracket.</p>
      </header>

      <!-- Formulário de Cadastro -->
      <form class="auth-form" id="form-cadastro" method="post" action="#" novalidate>

        <!-- Nome Completo -->
        <div class="form-group">
          <label for="nome-completo">Nome completo</label>
          <input
            type="text"
            id="nome-completo"
            name="nome_completo"
            placeholder="Ex: Rafael Tejima"
            autocomplete="name"
            required
          />
        </div>

        <!-- Nome de Usuário -->
        <div class="form-group">
          <label for="username">Nome de usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ex: rafa_cs2"
            autocomplete="username"
            required
          />
        </div>

        <!-- E-mail -->
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-divider" aria-hidden="true"></div>

        <!-- Senha -->
        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        <!-- Confirmação de Senha -->
        <div class="form-group">
          <label for="confirmar-senha">Confirmar senha</label>
          <input
            type="password"
            id="confirmar-senha"
            name="confirmar_senha"
            placeholder="Repita sua senha"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- Botão de Cadastro -->
        <button type="submit" class="btn-primary" id="btn-cadastrar">
          Criar minha conta
        </button>

        <!-- Redirecionamento para Login -->
        <p class="redirect-text">
          Já tem uma conta?
          <a href="login.html" id="link-ir-login">Faça login</a>
        </p>

      </form>
    </article>
  </main>
  
</body>
</html>
